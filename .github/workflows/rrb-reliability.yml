name: RRB Reliability Investigation

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RRB reliability probe
        run: npx tsx --tsconfig tsconfig.json scripts/probe-rrb-reliability.ts
